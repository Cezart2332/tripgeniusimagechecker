name: Image Checker CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

# ─────────────────────────────
# 1. TEST & LINT
# ─────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check moderation main.py tests scripts

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: pip vulnerability audit
        run: |
          pip-audit -r requirements.txt 2>&1 | tee pip-audit-report.txt
          if grep -qiE "Found [0-9]+ known vulnerabilities" pip-audit-report.txt; then
            echo "Vulnerable Python packages found!"
            exit 1
          fi
          echo "No vulnerable packages found"


# ─────────────────────────────
# 2. SEMGREP SAST
# ─────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/secrets
            p/owasp-top-ten


# ─────────────────────────────
# 3. GITLEAKS — SECRET SCANNING
# ─────────────────────────────
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ─────────────────────────────
# 4. BUILD & PUSH DOCKER IMAGE
# ─────────────────────────────
  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [test, semgrep, gitleaks]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            cezarique/tripgeniusimagechecker:latest
            cezarique/tripgeniusimagechecker:sha-${{ github.sha }}
          cache-from: type=registry,ref=cezarique/tripgeniusimagechecker:cache
          cache-to: type=registry,ref=cezarique/tripgeniusimagechecker:cache,mode=max


# ─────────────────────────────
# 5. TRIVY — CONTAINER SCAN
# ─────────────────────────────
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: cezarique/tripgeniusimagechecker:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'


# ─────────────────────────────
# 6. OWASP ZAP — BASELINE SCAN
# ─────────────────────────────
  zap:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Start moderation container
        run: |
          docker run -d --name moderation -p 8000:8000 \
            cezarique/tripgeniusimagechecker:sha-${{ github.sha }}

          echo "Waiting for moderation API..."
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Moderation API is up"
              exit 0
            fi
            echo "Attempt $i/60..."
            sleep 5
          done

          echo "Moderation API failed to start. Logs:"
          docker logs moderation
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: docker rm -f moderation


# ─────────────────────────────
# 7. DEPLOY (ONLY IF ALL OK)
# ─────────────────────────────
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build, trivy, zap]

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_DOMAIN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -sSf -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
